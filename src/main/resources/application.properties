spring.application.name=touristrecord_api
server.port=8080

# ---- PostgreSQL ----
# Change username/password below to match YOUR local PostgreSQL,
# or set environment variables DB_USERNAME / DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/touristdb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---- JWT ----
# Secret must be at least 32 characters (HS256). Demo value only.
jwt.secret=ThisIsADemoSecretKeyForLabExamOnly_ChangeMe_123456
jwt.expiration-ms=3600000

# ---- Demo login account ----
app.demo.username=admin
app.demo.password=admin123
